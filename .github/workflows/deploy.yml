name: Deploy static content to Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SIGNALING_ORIGIN: ${{ vars.SLOWCLAW_SIGNALING_ORIGIN }}
    steps:
      - name: Checkout current landing page
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Checkout companion source
        if: env.SIGNALING_ORIGIN != ''
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: zanynik/slowclaw.social
          ref: main
          path: companion-source
      - uses: actions/setup-node@v4
        if: env.SIGNALING_ORIGIN != ''
        with:
          node-version: '22'
      - name: Build static companion
        if: env.SIGNALING_ORIGIN != ''
        working-directory: companion-source/web
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.parse
          endpoint = urllib.parse.urlsplit(os.environ['SIGNALING_ORIGIN'])
          if endpoint.scheme != 'https' or not endpoint.hostname or not endpoint.hostname.endswith('.workers.dev') or endpoint.username or endpoint.password or endpoint.port or endpoint.path not in ('', '/') or endpoint.query or endpoint.fragment:
              raise SystemExit('Use the HTTPS Cloudflare Worker origin, without a path or credentials.')
          pathlib.Path('public/peer-config.json').write_text(json.dumps({'signalingOrigin': 'https://' + endpoint.hostname, 'iceServers': [{'urls': ['stun:stun.l.google.com:19302']}]}))
          PY
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload existing landing page
        if: env.SIGNALING_ORIGIN == ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Upload static companion
        if: env.SIGNALING_ORIGIN != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: companion-source/web/dist-static
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
